# cda.aitools template — projects.root substituted by Nix (cda.aitools.ccmux.projectsRoot).

schema_version = 1
theme = "catppuccin-mocha"
editor = ""

[projects]
  root = "@PROJECTS_ROOT@"

[sleep]
  mode = "safe"
  dangerous_keep_awake_on_battery = false
  low_battery_cutoff = 20

[daemon]
  poll_interval_seconds = 2
  idle_seconds_for_needs_input = 3
  listen_tailnet = true
  tailnet_port = 7474
  ssh_user = ""

[notes]
  auto_log_sessions = true
  expand_folders = false

[notifications]
  bell = true
  sound = "terminal"

[sessions]
  default_dir = ""
  attach_mode = "mirror"

[conversations]
  show_headless = false

[agents]
  default = "cursor"
  [agents.claude]
  [agents.codex]
  [agents.antigravity]
  [agents.cursor]
    command = "cursor-agent"
  [agents.pi]
  [agents.grok]
  [agents.muse]
  [agents.gemini]

[claude]

[update]
  auto_check = false

[subscription]
  tier = "api"

  [subscription.tiers]
    cursor = "ultra"

[tour]
  shown = true
  shown_version = "0.6.4"

[setup]
  completed = true
  nudge_dismissed = false

[apns]
  enabled = false
  key_path = ""
  key_id = ""
  team_id = ""
  topic = ""
  environment = ""

[fcm]
  enabled = false
  credentials_path = ""
  project_id = ""

[openrouter]
  enabled = false
  api_key = ""
