# cda.aitools — starter tmux.conf (copy into $CDA_AITOOLS_HOME/tmux.conf)
# Experimental. Wire from your ~/.tmux.conf (or nix-darwin programs.tmux.extraConfig)
# with: source-file $CDA_AITOOLS_HOME/tmux.conf
#
# Dogfood (macOS + Ghostty): also set macos-option-as-alt = left in Ghostty so
# Option+p reaches tmux as M-p instead of inserting « π ».

set -g mouse on
set -g history-limit 50000
setw -g mode-keys vi
set -g destroy-unattached off

# Clipboard: OSC 52 (Ghostty) + pbcopy fallback on macOS
set -g set-clipboard on
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# ccmux status in the bar (requires ccmux on PATH + hooks via `ccmux setup`)
set -g status-right '#{@ccmux_status} %H:%M'
set -g window-status-format '#I:#W#{@ccmux_mark}'
set -g window-status-current-format '#I:#W#{@ccmux_mark}'

# Alt+p : picker ccmux (tmux ≥ 3.2). Prefix+C-p as fallback.
bind-key -n M-p display-popup -E -w 80% -h 75% "ccmux"
bind-key C-p display-popup -E -w 80% -h 75% "ccmux"
