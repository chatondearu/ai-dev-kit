# cda.aitools — starter tmux.conf (copy into $CDA_AITOOLS_HOME/tmux.conf)
# Experimental. Wire from your ~/.tmux.conf with: source-file $CDA_AITOOLS_HOME/tmux.conf

set -g mouse on
set -g history-limit 50000
setw -g mode-keys vi

