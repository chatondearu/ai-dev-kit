[workspace]
resolver = "2"
members = [
    "crates/cdamux-core",
    "crates/cdamuxd",
    "crates/cdamux-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chatondearu/ai-dev-kit"
rust-version = "1.75"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
skim = "0.20"
ratatui = "0.28"
crossterm = "0.28"
ansi-to-tui = "6"
pulldown-cmark = "0.13"
