# cdamux example — copy to ~/.config/cdamux/config.toml

schema_version = 1

[projects]
# How to find bookmarkable directories under each root:
# flat      = immediate children only (skzv/ccmux parity)
# git_only  = any directory containing .git (within max_depth)
# depth     = use max_depth with flat semantics per level
discover = "git_only"
max_depth = 6

[[projects.roots]]
path = "/hdd/dev"
label = "dev"

[[projects.roots]]
path = "/home/chaton/etc/nixos"
label = "nixos"

[sessions]
# mirror    = tmux attach without -d (other clients stay)
# exclusive = attach with -d
attach_mode = "mirror"
# project | cwd | agent | group_path | none
group_by = "project"

[daemon]
# poll_interval_seconds is unused since the daemon IPC removal; kept for config compatibility.
poll_interval_seconds = 2
idle_seconds_for_needs_input = 3
# Quiet `working` pane before Fleet shows `working ⚠` (ADR-011 §3); does not rewrite status.
working_warn_seconds = 600
listen_tailnet = false
tailnet_port = 7480

[agents]
default = "cursor"

# `resume` (optional, per agent): command `cdamux restore` types to reopen a recorded
# conversation; `{id}` is the agent session id from the restore registry (ADR-009).
# Unset → built-in default on the configured `command`:
#   claude   = "<command> --resume {id}"
#   cursor   = "<command> --resume={id}"
#   opencode = "<command> --session {id}"
#   pi       = none (restores start a fresh conversation)
# `resume = ""` disables resume for that agent.

[agents.cursor]
command = "cursor-agent"

[agents.opencode]
command = "opencode"

[agents.claude]
command = "claude"
# resume = "claude --resume {id}"

[agents.pi]
command = "pi"

[ui]
# dashboard = full TUI (future)
# pick      = minimal picker, exit after switch-client
default_mode = "dashboard"
preview_max_lines = 80

# Worktree parent for Fleet spawn modal (`w`) and `cdamux worker spawn` (default).
# When unset, `worker spawn` uses `$CDAMUX_HOME/worktrees`. Not wired to orch-auto (ADR-003).
# [worktrees]
# root = "/home/you/.local/share/cdamux/worktrees"

[notes]
# Default: <project>/.cdamux/notes.md
# Optional central store (slug per project path):
# central_root = "/home/you/.config/cdamux/notes"
relative_path = ".cdamux/notes.md"
# editor = "nvim"  # default: $EDITOR or vi

# Retention for `cdamux state gc`: archive then remove done/error agents and
# finished runs with no live host older than this many days (must be >= 1).
# Dormant resumable agents (session restore registry) are kept.
[state]
retention_days = 14
